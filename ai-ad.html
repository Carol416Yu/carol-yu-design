  <main class="work-grid">
    <!--
      每個 .work-item 是一支影片：
      1) data-embed 換成你的嵌入網址
         YouTube： https://www.youtube.com/embed/影片ID
         Dailymotion： https://www.dailymotion.com/embed/video/影片ID
      2) data-title 換成作品名稱
      3) 裡面的 placeholder-box 換成 <img src="images/縮圖.jpg" style="width:100%;height:100%;object-fit:cover;">
    -->
    <div class="work-item" data-embed="" data-title="作品 01">
      <div class="placeholder-box" style="position:absolute;inset:0;"><span>作品縮圖 01<br><small>換上 YouTube/Dailymotion 縮圖</small></span></div>
      <div class="work-item-play"></div>
      <div class="work-item-overlay"><span class="work-item-title">作品名稱 01</span></div>
    </div>
    <div class="work-item" data-embed="" data-title="作品 02">
